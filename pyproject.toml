[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-reports-bot"
version = "0.1.0"
description = "Local-first Telegram bot for PM daily draft reports"
requires-python = ">=3.9"
dependencies = [
  "python-telegram-bot[job-queue]==21.6",
  "python-dotenv==1.0.1",
  "flask==3.1.2",
  "fastapi==0.128.8",
  "uvicorn==0.39.0",
  "jinja2==3.1.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
